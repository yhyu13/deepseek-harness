<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1080" viewBox="0 0 1400 1080">
  <defs>
    <marker id="mSlate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 1 L12 6 L0 11 z" fill="#475569"/></marker>
    <marker id="mIndigo" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 1 L12 6 L0 11 z" fill="#4F46E5"/></marker>
    <marker id="mGreen" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 1 L12 6 L0 11 z" fill="#16A34A"/></marker>
    <marker id="mAmber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 1 L12 6 L0 11 z" fill="#D97706"/></marker>
    <marker id="mBlue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 1 L12 6 L0 11 z" fill="#2563EB"/></marker>
  </defs>
  <rect width="1400" height="1080" fill="#F8FAFC"/>
  <style>
    text{font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif}
    .t{font-size:28px;font-weight:700;fill:#0F172A}
    .st{font-size:16px;fill:#64748B}
    .bt{font-size:21px;font-weight:700}
    .bs{font-size:15px;fill:#475569}
    .chip{font-size:13px;font-weight:600}
    .lb{font-size:15px;fill:#475569}
    .no{font-size:14px;fill:#9F1239}
  </style>

  <text x="56" y="46" class="t">接缝：一个服务持有状态，三个消费者不拥有状态</text>
  <text x="56" y="72" class="st">是：命令 / 工具 / 调度走 ctx.goals。不是：在 agent-loop 里加 goal 分支。</text>

  <rect x="80" y="96" width="500" height="88" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
  <text x="104" y="134" class="bt" fill="#1D4ED8">dsh-command-goal · 人</text>
  <text x="104" y="162" class="bs">/goal · create / edit / pause / resume / clear</text>

  <rect x="820" y="96" width="500" height="88" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
  <text x="844" y="134" class="bt" fill="#1D4ED8">dsh-tool-goal · 模型</text>
  <text x="844" y="162" class="bs">get_goal / create_goal / update_goal · 先过 authority</text>

  <line x1="330" y1="184" x2="330" y2="258" stroke="#2563EB" stroke-width="3" marker-end="url(#mBlue)"/>
  <rect x="348" y="208" width="168" height="28" rx="6" fill="#DBEAFE"/>
  <text x="432" y="227" class="chip" fill="#1D4ED8" text-anchor="middle">人：改目标 / 启停</text>

  <line x1="1070" y1="184" x2="1070" y2="258" stroke="#2563EB" stroke-width="3" marker-end="url(#mBlue)"/>
  <rect x="860" y="208" width="196" height="28" rx="6" fill="#DBEAFE"/>
  <text x="958" y="227" class="chip" fill="#1D4ED8" text-anchor="middle">模型：宿主签发才改</text>

  <rect x="250" y="260" width="900" height="120" rx="14" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2.5"/>
  <text x="700" y="304" class="bt" fill="#3730A3" text-anchor="middle">dsh-goal · ctx.goals（主干：唯一持有状态）</text>
  <text x="700" y="334" class="bs" text-anchor="middle">是：事件溯源 · CAS · 严格 fold</text>
  <text x="700" y="358" class="no" text-anchor="middle">不是：消费者各存一份；不是 loop 内的 goal 字段</text>

  <line x1="700" y1="380" x2="700" y2="456" stroke="#16A34A" stroke-width="3" marker-end="url(#mGreen)"/>
  <rect x="718" y="404" width="196" height="28" rx="6" fill="#DCFCE7"/>
  <text x="816" y="423" class="chip" fill="#15803D" text-anchor="middle">append goal/change</text>

  <rect x="250" y="458" width="900" height="96" rx="14" fill="#ECFDF5" stroke="#16A34A" stroke-width="2.5"/>
  <text x="700" y="498" class="bt" fill="#166534" text-anchor="middle">树根 · Session log（唯一持久真相）</text>
  <text x="700" y="528" class="bs" text-anchor="middle">当前状态由 fold 推出，不另存表</text>

  <path d="M250 506 H70 V320 H248" fill="none" stroke="#4F46E5" stroke-width="3" marker-end="url(#mIndigo)"/>
  <rect x="8" y="392" width="120" height="52" rx="6" fill="#E0E7FF"/>
  <text x="68" y="414" class="chip" fill="#3730A3" text-anchor="middle">严格 fold</text>
  <text x="68" y="432" class="chip" fill="#3730A3" text-anchor="middle">回放到领域</text>

  <line x1="700" y1="554" x2="700" y2="628" stroke="#D97706" stroke-width="3" marker-end="url(#mAmber)"/>
  <rect x="718" y="576" width="176" height="28" rx="6" fill="#FEF3C7"/>
  <text x="806" y="595" class="chip" fill="#B45309" text-anchor="middle">emit goal/changed</text>

  <rect x="250" y="630" width="900" height="96" rx="14" fill="#FEF3C7" stroke="#D97706" stroke-width="2.5"/>
  <text x="700" y="670" class="bt" fill="#92400E" text-anchor="middle">dsh-goal-round-driver（round 分支）</text>
  <text x="700" y="700" class="bs" text-anchor="middle">是：idle + active + armed + 有余量才预留一轮。不是：重试队列</text>

  <line x1="700" y1="726" x2="700" y2="800" stroke="#2563EB" stroke-width="3" marker-end="url(#mBlue)"/>
  <rect x="718" y="750" width="228" height="28" rx="6" fill="#DBEAFE"/>
  <text x="832" y="769" class="chip" fill="#1D4ED8" text-anchor="middle">注入完整 &lt;goal_round&gt;</text>

  <rect x="250" y="802" width="900" height="88" rx="14" fill="#EFF6FF" stroke="#2563EB" stroke-width="2.5"/>
  <text x="700" y="840" class="bt" fill="#1D4ED8" text-anchor="middle">模型 · 下一轮</text>
  <text x="700" y="868" class="bs" text-anchor="middle">有证据再 complete · 连续 N 轮同条件才 blocked</text>

  <path d="M1150 846 H1330 V320 H1152" fill="none" stroke="#475569" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#mSlate)"/>
  <rect x="1170" y="560" width="220" height="52" rx="6" fill="#E2E8F0"/>
  <text x="1280" y="582" class="chip" fill="#334155" text-anchor="middle">complete / blocked</text>
  <text x="1280" y="600" class="chip" fill="#334155" text-anchor="middle">走 update_goal 回领域</text>

  <text x="700" y="920" class="bs" text-anchor="middle">未完成不走虚线：agent 回到 idle 后，driver 再走主轴注入下一轮</text>

  <circle cx="80" cy="1044" r="7" fill="#4F46E5"/><text x="96" y="1049" class="lb">领域(状态)</text>
  <circle cx="240" cy="1044" r="7" fill="#16A34A"/><text x="256" y="1049" class="lb">持久化</text>
  <circle cx="380" cy="1044" r="7" fill="#D97706"/><text x="396" y="1049" class="lb">运行时调度</text>
  <circle cx="540" cy="1044" r="7" fill="#2563EB"/><text x="556" y="1049" class="lb">模型 / 人类消费者</text>
  <text x="820" y="1049" class="lb">实线 = 主路径　　虚线 = 终态写回</text>
</svg>
