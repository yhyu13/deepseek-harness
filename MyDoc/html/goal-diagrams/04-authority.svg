<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="780" viewBox="0 0 1320 780">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#64748B"/></marker>
  </defs>
  <rect width="1320" height="780" fill="#F8FAFC"/>
  <style>
    text{font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif}
    .t{font-size:26px;font-weight:700;fill:#0F172A}
    .st{font-size:16px;fill:#64748B}
    .ly{font-size:19px;font-weight:700}
    .ls{font-size:15px;fill:#334155}
    .no{font-size:14px;fill:#9F1239}
    .rh{font-size:17px;font-weight:700;fill:#B91C1C}
    .rb{font-size:14px;fill:#7F1D1D}
    .sh{font-size:13px;font-weight:700;fill:#9F1239}
  </style>
  <text x="56" y="48" class="t">authority 分支：运行时签发，不是提示词</text>
  <text x="56" y="74" class="st">是：活着的事实。不是：提示词约束，也不是 root/fork 血缘。</text>

  <rect x="56" y="106" width="720" height="140" rx="14" fill="#EFF6FF" stroke="#2563EB" stroke-width="2.5"/>
  <text x="86" y="144" class="ly" fill="#1D4ED8">第 1 层 · 调用者必须存活</text>
  <text x="86" y="176" class="ls">精确匹配的存活 agent · running · 当前 initiator · 开放 turn</text>
  <text x="86" y="208" class="no">不是：过期回合、已销毁 agent、initiator 不匹配</text>

  <rect x="56" y="306" width="720" height="140" rx="14" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2.5"/>
  <text x="86" y="344" class="ly" fill="#5B21B6">第 2 层 · 改目标要直接人类输入</text>
  <text x="86" y="376" class="ls">宿主签发的 { kind: 'user' } → 才允许 create / edit / pause / resume</text>
  <text x="86" y="408" class="no">不是：子代理 / 注入 / 调度器继承人类权限</text>

  <rect x="56" y="506" width="720" height="140" rx="14" fill="#ECFDF5" stroke="#16A34A" stroke-width="2.5"/>
  <text x="86" y="544" class="ly" fill="#166534">第 3 层 · 终态报告走窄通道</text>
  <text x="86" y="576" class="ls">complete / blocked ← 直接人类 或 当前 goal round（只能报终止）</text>
  <text x="86" y="608" class="no">不是：模型自己说了算；blocked 还要连续 N 轮同条件</text>

  <line x1="416" y1="246" x2="416" y2="304" stroke="#64748B" stroke-width="2" marker-end="url(#a)"/>
  <line x1="416" y1="446" x2="416" y2="504" stroke="#64748B" stroke-width="2" marker-end="url(#a)"/>

  <rect x="836" y="106" width="428" height="540" rx="14" fill="#FEF2F2" stroke="#DC2626" stroke-width="2.5"/>
  <text x="866" y="148" class="rh">会被拒绝的调用</text>
  <line x1="866" y1="164" x2="1234" y2="164" stroke="#FECACA" stroke-width="2"/>
  <text x="866" y="196" class="sh">本分支（authority.ts）</text>
  <text x="866" y="228" class="rb">× 子代理（非 root agent）</text>
  <text x="866" y="258" class="rb">× 无 {kind:'user'} 的注入消息</text>
  <text x="866" y="288" class="rb">× 过期 turn / 无开放 turn</text>
  <text x="866" y="318" class="rb">× initiator 不匹配 / agent 已销毁</text>
  <line x1="866" y1="342" x2="1234" y2="342" stroke="#FECACA" stroke-width="2"/>
  <text x="866" y="374" class="sh">相邻分支（不是本图）</text>
  <text x="866" y="406" class="rb">× 恢复后未 resume（activation）</text>
  <text x="866" y="436" class="rb">× 过期 revision（主干 CAS）</text>
  <line x1="866" y1="464" x2="1234" y2="464" stroke="#FECACA" stroke-width="2"/>
  <text x="866" y="506" class="rb">提示词只能引导「该不该」，</text>
  <text x="866" y="534" class="rb">执行期校验才决定「能不能」。</text>
  <text x="866" y="590" class="rb">血缘能说明来历，</text>
  <text x="866" y="618" class="rb">不能代替这一回合的签发。</text>
</svg>
