<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="780" viewBox="0 0 1320 780">
  <rect width="1320" height="780" fill="#F8FAFC"/>
  <style>
    text{font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif}
    .t{font-size:26px;font-weight:700;fill:#0F172A}
    .st{font-size:16px;fill:#64748B}
    .n{font-size:18px;font-weight:700;fill:#1E293B}
    .p{font-size:15px;fill:#334155}
  </style>
  <text x="56" y="48" class="t">收获：能搬走的是这七句，不是文件名</text>
  <text x="56" y="74" class="st">树叶会改名。根和主干如果对了，换一套实现还是同一棵树。</text>

  <rect x="56" y="100" width="590" height="88" rx="12" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
  <text x="80" y="136" class="n">1. 别把目标焊进主循环</text>
  <text x="80" y="164" class="p">发动机不动；旁边一本可以回放的账</text>

  <rect x="674" y="100" width="590" height="88" rx="12" fill="#ECFDF5" stroke="#16A34A" stroke-width="2"/>
  <text x="698" y="136" class="n">2. 状态可回放，权限必须重授</text>
  <text x="698" y="164" class="p">进展写进日志；自动续跑授权只活在这一进程</text>

  <rect x="56" y="208" width="590" height="88" rx="12" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
  <text x="80" y="244" class="n">3. 模型看见的，必须能翻出来</text>
  <text x="80" y="272" class="p">内存叮嘱、口头「请继续」，不算目标功能</text>

  <rect x="674" y="208" width="590" height="88" rx="12" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/>
  <text x="698" y="244" class="n">4. 同时改一份账，过期的丢掉</text>
  <text x="698" y="272" class="p">先读版本再改；谁后写谁赢是 bug</text>

  <rect x="56" y="316" width="590" height="88" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
  <text x="80" y="352" class="n">5. 「我做完了」不算完</text>
  <text x="80" y="380" class="p">听工作区。卡住要连续出现，才允许认输</text>

  <rect x="674" y="316" width="590" height="88" rx="12" fill="#F0FDF4" stroke="#16A34A" stroke-width="2"/>
  <text x="698" y="352" class="n">6. 记账法可以不同，真相只能一本</text>
  <text x="698" y="380" class="p">一行表或一串事件，二选一；产品契约可以相近</text>

  <rect x="56" y="424" width="1208" height="88" rx="12" fill="#1E293B"/>
  <text x="80" y="460" font-size="18" font-weight="700" fill="#FFFFFF">7. 根和主干错了，叶子再漂亮也会在同一处裂开</text>
  <text x="80" y="488" font-size="15" fill="#CBD5E1">改 loop、把 armed 写进日志、用提示词当权限 —— 恢复、fork、子代理、空闲续跑会一起爆</text>

  <rect x="56" y="540" width="1208" height="190" rx="14" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/>
  <text x="80" y="584" font-size="20" font-weight="700" fill="#92400E">结论</text>
  <text x="80" y="624" class="p">给 Agent 加长期目标，不是让它「记得继续」，而是让世界有一本可回放的账，</text>
  <text x="80" y="656" class="p">并且每一次真正跑起来，都重新拿到执行授权。</text>
  <text x="80" y="696" class="p">能抄走的是这套切割，不是某个仓库里的文件名。</text>
</svg>
