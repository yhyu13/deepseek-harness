<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="860" viewBox="0 0 1320 860">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#64748B"/></marker>
  </defs>
  <rect width="1320" height="860" fill="#F8FAFC"/>
  <style>
    text{font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif}
    .t{font-size:26px;font-weight:700;fill:#0F172A}
    .st{font-size:16px;fill:#64748B}
    .h{font-size:20px;font-weight:700}
    .ch{font-size:16px;font-weight:700}
    .rl{font-size:15px;fill:#334155}
    .ed{font-size:13px;fill:#64748B}
    .or{font-size:18px;font-weight:700;fill:#64748B}
    .no{font-size:15px;fill:#9F1239}
  </style>
  <text x="56" y="48" class="t">切开：phase 持久，activation 永不落盘</text>
  <text x="56" y="74" class="st">是：进展可回放。不是：把「能否自动续跑」写进日志。</text>

  <rect x="56" y="106" width="560" height="580" rx="16" fill="#F0FDF4" stroke="#16A34A" stroke-width="2"/>
  <text x="86" y="146" class="h" fill="#166534">phase · 是什么（写进 session log）</text>

  <rect x="236" y="186" width="200" height="60" rx="10" fill="#16A34A"/>
  <text x="336" y="222" class="ch" fill="#FFFFFF" text-anchor="middle">active</text>

  <rect x="126" y="336" width="200" height="60" rx="10" fill="#D97706"/>
  <text x="226" y="372" class="ch" fill="#FFFFFF" text-anchor="middle">paused</text>

  <rect x="346" y="336" width="200" height="60" rx="10" fill="#DC2626"/>
  <text x="446" y="372" class="ch" fill="#FFFFFF" text-anchor="middle">blocked</text>

  <rect x="236" y="506" width="200" height="60" rx="10" fill="#2563EB"/>
  <text x="336" y="542" class="ch" fill="#FFFFFF" text-anchor="middle">complete</text>

  <line x1="296" y1="246" x2="246" y2="334" stroke="#64748B" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="176" y="276" class="ed">pause / resume</text>
  <line x1="376" y1="246" x2="426" y2="334" stroke="#64748B" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="422" y="276" class="ed">block / resume</text>
  <line x1="336" y1="246" x2="336" y2="504" stroke="#2563EB" stroke-width="2" marker-end="url(#a)"/>
  <text x="288" y="456" class="ed" fill="#1D4ED8">complete</text>
  <line x1="226" y1="396" x2="286" y2="506" stroke="#2563EB" stroke-width="2" marker-end="url(#a)"/>
  <text x="136" y="476" class="ed" fill="#1D4ED8">complete</text>
  <line x1="446" y1="396" x2="386" y2="506" stroke="#2563EB" stroke-width="2" marker-end="url(#a)"/>
  <text x="466" y="476" class="ed" fill="#1D4ED8">complete</text>
  <text x="86" y="640" class="ed">block 只从 active 进入；active / paused / blocked 均可 complete</text>
  <text x="86" y="662" class="no">不是：armed 写在 phase 里</text>

  <text x="656" y="396" class="or" text-anchor="middle">正交于</text>

  <rect x="704" y="106" width="560" height="580" rx="16" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/>
  <text x="734" y="146" class="h" fill="#92400E">activation · 是什么（永不落盘）</text>

  <rect x="794" y="186" width="220" height="60" rx="10" fill="#16A34A"/>
  <text x="904" y="222" class="ch" fill="#FFFFFF" text-anchor="middle">armed</text>
  <rect x="794" y="286" width="220" height="60" rx="10" fill="#94A3B8"/>
  <text x="904" y="322" class="ch" fill="#FFFFFF" text-anchor="middle">disarmed</text>
  <line x1="904" y1="246" x2="904" y2="284" stroke="#64748B" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>

  <text x="734" y="400" class="rl">create / resume → armed</text>
  <text x="734" y="430" class="rl">pause / complete / block / clear → disarmed</text>
  <text x="734" y="460" class="rl">edit → 保持原样</text>

  <line x1="734" y1="500" x2="1234" y2="500" stroke="#F59E0B" stroke-width="1"/>
  <text x="734" y="536" class="rl" font-weight="700" fill="#92400E">不是什么</text>
  <text x="734" y="566" class="no">不是随 goal/change 回放</text>
  <text x="734" y="596" class="no">不是恢复 / fork 后自动续跑</text>
  <text x="734" y="626" class="rl">session-start 强制 disarm；要人再 resume</text>

  <rect x="56" y="712" width="1208" height="108" rx="12" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="660" y="756" font-size="18" font-weight="700" fill="#B91C1C" text-anchor="middle">合法组合：phase = active，activation = disarmed</text>
  <text x="660" y="788" font-size="15" fill="#7F1D1D" text-anchor="middle">状态可以回放；执行授权必须重授</text>
</svg>
