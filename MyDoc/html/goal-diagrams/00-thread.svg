<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="980" viewBox="0 0 1320 980">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#64748B"/></marker>
  </defs>
  <rect width="1320" height="980" fill="#F8FAFC"/>
  <style>
    text{font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif}
    .t{font-size:28px;font-weight:700;fill:#0F172A}
    .st{font-size:16px;fill:#64748B}
    .h{font-size:20px;font-weight:700}
    .yes{font-size:15px;fill:#166534}
    .no{font-size:15px;fill:#9F1239}
    .cap{font-size:15px;fill:#475569}
  </style>

  <text x="56" y="48" class="t">逻辑脉络：加一个目标，不要改 loop</text>
  <text x="56" y="74" class="st">每一步先钉「是什么」，再钉「不是什么」。走到树叶之前，主线必须已经成立。</text>

  <rect x="80" y="110" width="1160" height="96" rx="14" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
  <text x="110" y="148" class="h" fill="#1D4ED8">需求 · Agent 盯住一个目标，跨回合工作直到真正完成</text>
  <text x="110" y="180" class="no">不是改 agent-loop、加计数器、或把「请继续」写进提示词</text>

  <line x1="660" y1="206" x2="660" y2="248" stroke="#64748B" stroke-width="2" marker-end="url(#a)"/>

  <rect x="80" y="250" width="1160" height="96" rx="14" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
  <text x="110" y="288" class="h" fill="#3730A3">接缝 · 一个 Goal 服务持有状态，命令 / 工具 / 调度只消费</text>
  <text x="110" y="320" class="no">不是单体 feature；调度、命令、模型工具都不拥有状态</text>

  <line x1="660" y1="346" x2="660" y2="388" stroke="#64748B" stroke-width="2" marker-end="url(#a)"/>

  <rect x="80" y="390" width="1160" height="96" rx="14" fill="#ECFDF5" stroke="#16A34A" stroke-width="2"/>
  <text x="110" y="428" class="h" fill="#166534">树根 · 每次变更追加 goal/change，当前态由日志 fold 出来</text>
  <text x="110" y="460" class="no">不是另存一张表；不是只活在内存、重启即丢的 steering</text>

  <line x1="660" y1="486" x2="660" y2="528" stroke="#64748B" stroke-width="2" marker-end="url(#a)"/>

  <rect x="80" y="530" width="1160" height="96" rx="14" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/>
  <text x="110" y="568" class="h" fill="#5B21B6">主干 · 严格 fold + CAS revision → 现在是什么版本、什么 phase</text>
  <text x="110" y="600" class="no">不是后写覆盖；不是散落的布尔标志或字符串比较</text>

  <line x1="660" y1="626" x2="660" y2="668" stroke="#64748B" stroke-width="2" marker-end="url(#a)"/>

  <rect x="80" y="670" width="1160" height="120" rx="14" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
  <text x="110" y="708" class="h" fill="#92400E">切开 · phase 持久；activation / authority / round 只在运行时</text>
  <text x="110" y="740" class="yes">是：进展可回放；自动续跑、改停资格、何时开下一轮必须当场重授</text>
  <text x="110" y="768" class="no">不是把「能否自动续跑」写进日志，让恢复或 fork 的会话自己跑起来</text>

  <line x1="660" y1="790" x2="660" y2="832" stroke="#64748B" stroke-width="2" marker-end="url(#a)"/>

  <rect x="80" y="834" width="1160" height="88" rx="14" fill="#1E293B"/>
  <text x="660" y="872" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">主线：状态可回放，权限必须重授</text>
  <text x="660" y="900" font-size="15" fill="#CBD5E1" text-anchor="middle">树叶只实现这根主线，不另开第五条分支</text>
</svg>
