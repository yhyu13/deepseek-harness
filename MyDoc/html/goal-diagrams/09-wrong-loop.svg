<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="620" viewBox="0 0 1320 620">
  <rect width="1320" height="620" fill="#F8FAFC"/>
  <style>
    text{font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif}
    .t{font-size:26px;font-weight:700;fill:#0F172A}
    .st{font-size:16px;fill:#64748B}
    .h{font-size:20px;font-weight:700}
    .p{font-size:16px;fill:#334155}
    .no{font-size:15px;fill:#9F1239}
    .ok{font-size:15px;fill:#166534}
  </style>
  <text x="56" y="48" class="t">第一反应往往是改主循环。那是错路。</text>
  <text x="56" y="74" class="st">是：主循环不动，旁边接一个目标服务。不是：在 loop 里加 goal 分支、加计数器、写「请继续」。</text>

  <rect x="56" y="110" width="580" height="300" rx="14" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
  <text x="86" y="154" class="h" fill="#B91C1C">错路 · 改 loop</text>
  <text x="86" y="200" class="no">在主循环里加一个 goal 分支</text>
  <text x="86" y="236" class="no">加一个「已经跑了几轮」的计数器</text>
  <text x="86" y="272" class="no">系统提示词里写「请继续完成目标」</text>
  <text x="86" y="320" class="p">看起来快。重启、回放、子代理、</text>
  <text x="86" y="352" class="p">空闲续跑，会在同一处裂开。</text>

  <rect x="684" y="110" width="580" height="300" rx="14" fill="#ECFDF5" stroke="#16A34A" stroke-width="2"/>
  <text x="714" y="154" class="h" fill="#166534">正路 · 接一条缝</text>
  <text x="714" y="200" class="ok">主循环一行不改</text>
  <text x="714" y="236" class="ok">一个服务专门记目标</text>
  <text x="714" y="272" class="ok">人的命令、模型的工具、空闲调度</text>
  <text x="714" y="308" class="ok">都只消费这个服务，谁也不私藏一份</text>
  <text x="714" y="352" class="p">新行为走接缝，不进循环。</text>

  <rect x="56" y="440" width="1208" height="130" rx="14" fill="#1E293B"/>
  <text x="660" y="492" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">人话：别把「长期目标」焊进发动机。</text>
  <text x="660" y="532" font-size="16" fill="#CBD5E1" text-anchor="middle">发动机还是原来的发动机；目标是旁边一本可以回放的账。</text>
</svg>
